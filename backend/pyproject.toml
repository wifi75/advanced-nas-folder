[project]
name = "advanced-nas-folder"
version = "0.4.0"
description = "Pannello self-hosted per mount NFS, pubblicazione e gestione file"
authors = [{ name = "Tiziano Cassone" }]
license = { text = "MIT" }
# Nessun campo `readme`: setuptools rifiuta i percorsi fuori da questa cartella,
# e il README del progetto sta nella radice del repository.
requires-python = ">=3.14"

# Versioni interrogate direttamente su PyPI il 2026-08-29.
# NON aggiornarle a memoria e NON fidarsi delle ricerche web: interrogare il
# registro. Vedere docs/VERSIONI.md.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "aiosqlite==0.22.1",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Dichiarato esplicitamente: senza, setuptools non sa quale cartella
# impacchettare quando accanto ad app/ ci sono anche alembic/ e .venv/.
include = ["app*"]

# La configurazione di ruff sta in ruff.toml nella radice del repository:
# copre backend/, agent/ e tests/ con le stesse regole.

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
