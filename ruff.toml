# Configurazione unica per i tre alberi Python del progetto:
# backend/, agent/ e tests/. Tenerla nella radice evita che l'agent, che e il
# componente piu delicato, sfugga ai controlli perche vive fuori da backend/.

line-length = 100
target-version = "py314"

# Le migrazioni le scrive alembic, non noi: riformattarle le farebbe divergere
# da cio che il comando rigenera, e il confronto con una nuova migrazione
# diventerebbe illeggibile.
extend-exclude = ["backend/alembic"]

[lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM"]

ignore = [
    # I nomi del progetto sono in italiano: "ErroreAgent" e corretto qui, e
    # rinominarlo in "AgentError" renderebbe il codice incoerente con tutto
    # il resto.
    "N818",
]

[lint.per-file-ignores]
# pytest usa assert; e i valori fittizi nei test non sono credenziali vere.
"tests/**" = ["S101", "S105", "S106"]

[format]
docstring-code-format = true
