# Esegue SOLO anf-api in un container. L'agent privilegiato e il web server
# restano servizi nativi sull'host, esattamente come descritto in
# docs/PIANO.md (Nodo 1): qui si containerizza solo l'applicazione senza
# privilegi, non il pezzo che monta filesystem da root.
#
# Prerequisito: installazione nativa gia' fatta con install.sh — serve
# comunque a creare l'utente di sistema "anf", l'agent, il web server e le
# cartelle. Questo compose sostituisce il solo servizio systemd anf-api.
# Guida completa: docs/DOCKER.md.

# Nome esplicito dello stack: senza, Docker Compose lo deduce dal nome della
# cartella da cui si lancia ("docker", quello di "deploy/docker/") — generico
# e destinato a scontrarsi con qualunque altro progetto che usi la stessa
# convenzione di cartella sullo stesso host.
name: advanced-nas-folder

services:
  anf-api:
    build:
      context: ../../backend
    image: advanced-nas-folder-api:local
    # Senza, un orchestratore che fa "pull" prima di avviare lo stack (come
    # Portainer con "Pull and redeploy") prova a scaricare questa immagine da
    # un registry — che non esiste, l'immagine si costruisce solo in locale
    # dal Dockerfile qui sopra. "build" dice di costruirla sempre, mai
    # scaricarla.
    pull_policy: build
    # Nome esplicito che porta l'identita' del progetto, senza il suffisso
    # numerico di replica che Compose aggiungerebbe da solo (".../anf-api-1"):
    # non ha senso qui, il servizio non e' pensato per scalare a piu' istanze.
    container_name: advanced-nas-folder-anf-api
    restart: unless-stopped
    # Deve combaciare con l'utente di sistema "anf" creato da install.sh:
    # scoprirlo con `id anf` sull'host. Senza, il container non puo' leggere
    # ne' scrivere i volumi qui sotto, che sull'host appartengono a lui.
    user: "${ANF_UID}:${ANF_GID}"
    ports:
      # Solo sul loopback dell'host: la stessa proprieta' di sicurezza
      # dell'unit systemd nativa ("ascolto solo su 127.0.0.1"), qui applicata
      # dal mapping di porta invece che dal bind interno del processo (che
      # nel container e' 0.0.0.0 per necessita': vedi docker-entrypoint.sh).
      - "127.0.0.1:${ANF_PORT:-8100}:${ANF_PORT:-8100}"
    volumes:
      # NON "env_file": quello lo legge il PROCESSO che esegue `docker
      # compose`, non il motore Docker. Se a lanciarlo e' Portainer da uno
      # stack "da repository Git", quel processo gira dentro il container di
      # Portainer stesso — che ha montato solo il socket Docker, non
      # /var/www/advanced-nas-folder — quindi qualunque percorso host in
      # "env_file" fallisce li', anche se il file esiste davvero sull'host.
      # Un volume invece lo risolve sempre il demone Docker sull'host, non il
      # processo che ha chiamato compose: funziona identico da riga di
      # comando e da Portainer. docker-entrypoint.sh lo carica lui stesso
      # nell'ambiente prima di partire.
      - ${ANF_ENV_FILE:-/var/www/advanced-nas-folder/.env}:/run/secrets/anf.env:ro
      - ${ANF_DATA_DIR:-/var/lib/anf}:/var/lib/anf
      - ${ANF_SOCKET_DIR:-/run/anf}:/run/anf
      - type: bind
        source: ${ANF_MOUNT_ROOT:-/srv/nas}
        target: /srv/nas
        bind:
          # I mount NFS li crea e li smonta systemd sull'host anche dopo che
          # il container e' partito (automount alla prima richiesta): senza
          # rslave il container vedrebbe la cartella per sempre vuota.
          propagation: rslave
